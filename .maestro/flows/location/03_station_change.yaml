appId: com.subwaynow.app
name: "위치 - 역 변경 (강남 → 잠실)"
---
# 강남역에서 시작
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: allow
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

# 강남역 감지 확인
- assertVisible:
    text: "강남"
    timeout: 15000

# 잠실역으로 위치 변경
- setLocation:
    latitude: 37.513262
    longitude: 127.100159

# 잠실역으로 변경될 때까지 대기 (폴링 주기 30초, 2사이클 커버)
- assertVisible:
    text: "잠실"
    timeout: 70000
