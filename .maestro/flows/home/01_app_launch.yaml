appId: com.subwaynow.app
name: "홈 화면 - 앱 실행 및 역 감지"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

# Expo dev-client URL 선택 화면 (개발 빌드에서만 등장 — 프로덕션은 optional로 skip)
- tapOn:
    text: ".*localhost.*"
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: ".*허용.*"
    optional: true

# Dev Menu가 떠 있으면 swipe down으로 닫음
- swipe:
    start: 50%, 50%
    end: 50%, 95%

# 홈 화면 로드 (testID는 accessibility 트리에 즉시 노출)
- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000

# 역 감지 확인 (GPS → useNearestStation 30s 폴링 cold start까지 grace)
- extendedWaitUntil:
    visible:
      text: "강남"
    timeout: 60000

# 목적지 설정 버튼
- assertVisible:
    id: "destination-button"

- assertVisible:
    text: "목적지 설정"

# 도착 정보 섹션
- assertVisible:
    text: "열차 도착 정보"
