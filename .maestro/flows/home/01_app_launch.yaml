appId: com.subwaynow.app
name: "홈 화면 - 앱 실행 및 역 감지"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

# 홈 화면 로드 + 강남역 감지 확인
- extendedWaitUntil:
    visible:
      text: "강남"
    timeout: 15000

# 목적지 설정 버튼
- assertVisible:
    id: "destination-button"

- assertVisible:
    text: "목적지 설정"

# 도착 정보 섹션
- assertVisible:
    text: "Next trains"
