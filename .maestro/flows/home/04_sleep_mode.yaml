appId: com.subwaynow.app
name: "홈 화면 - 취침 모드 토글"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: allow
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000

# 목적지 설정 (취침 모드는 목적지 있을 때만 표시)
- tapOn:
    id: "destination-button"
- assertVisible:
    id: "search-input"
- tapOn:
    id: "search-input"
- inputText: "잠실"
- assertVisible:
    id: "suggestions-list"
- tapOn:
    id: "suggestion-item-2-016"

# 취침 모드 스위치 확인 및 토글
- assertVisible:
    id: "home-sleep-mode-switch"
- tapOn:
    id: "home-sleep-mode-switch"

# 설정 탭에서 동기화 확인
- tapOn:
    text: "설정"
- assertVisible:
    id: "sleep-mode-switch"

# 설정 탭에서 토글 해제
- tapOn:
    id: "sleep-mode-switch"

# 홈으로 돌아가서 확인
- tapOn:
    text: "현재 역"
- assertVisible:
    id: "home-sleep-mode-switch"
