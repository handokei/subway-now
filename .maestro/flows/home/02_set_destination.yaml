appId: com.subwaynow.app
name: "홈 화면 - 목적지 설정"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: allow
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

- assertVisible:
    id: "destination-button"
    timeout: 15000

- tapOn:
    id: "destination-button"

- assertVisible:
    id: "search-input"
    timeout: 5000

- tapOn:
    id: "search-input"
- inputText: "잠실"

- assertVisible:
    id: "suggestions-list"
    timeout: 5000

- tapOn:
    id: "suggestion-item-2-016"

# 목적지 설정됨 확인
- assertVisible:
    text: "잠실"
    timeout: 5000

- assertVisible:
    text: "목적지 변경"

- assertVisible:
    id: "destination-clear-button"

- assertVisible:
    id: "sleep-mode-row"
