appId: com.subwaynow.app
name: "gps - 역 변경 (강남 → 잠실)"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

- extendedWaitUntil:
    visible:
      text: "강남|Gangnam"
    timeout: 15000

- setLocation:
    latitude: 37.513262
    longitude: 127.100159

- extendedWaitUntil:
    visible:
      text: "잠실|Jamsil"
    timeout: 70000
