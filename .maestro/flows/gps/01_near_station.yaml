appId: com.subwaynow.app
name: "gps - 역 근처 (강남역)"
# nightly 전용. 실제 useNearestStation 흐름을 검증하므로 mock 빌드 아님.
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

- extendedWaitUntil:
    visible:
      text: "현재역|Current station"
    timeout: 15000

- assertVisible:
    text: "강남|Gangnam"
- assertVisible:
    text: "Next trains"
- assertVisible:
    text: "상행|Upbound"
- assertVisible:
    text: "하행|Downbound"
