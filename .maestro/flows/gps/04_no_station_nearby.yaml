appId: com.subwaynow.app
name: "gps - 역에서 먼 곳"
---
- setLocation:
    latitude: 37.40
    longitude: 127.10

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

# 외부 시스템 UI(권한 alert) — text 매칭 유지
- tapOn:
    text: ".*허용.*"
    optional: true

- extendedWaitUntil:
    visible:
      id: "home-not-near-station-title"
    timeout: 15000

- assertVisible:
    id: "home-refresh-button"
