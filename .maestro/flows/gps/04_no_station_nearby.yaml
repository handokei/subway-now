appId: com.subwaynow.app
name: "gps - 역에서 먼 곳"
---
- setLocation:
    latitude: 37.40
    longitude: 127.10

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

- extendedWaitUntil:
    visible:
      text: "지하철역 근처가 아닙니다"
    timeout: 15000

- assertVisible:
    text: "새로고침"
