appId: com.subwaynow.app
name: "알람 - 포그라운드 취침모드 알람 트리거"
---
# 강남역에서 시작
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true

# Expo Dev Client: localhost 서버 선택
- tapOn:
    text: ".*localhost.*"
    optional: true

# 번들 로드 대기
- waitForAnimationToEnd

# iOS 알림 권한 허용
- tapOn:
    text: "허용"
    optional: true

# Expo 개발자 메뉴 Continue 탭
- tapOn:
    text: "Continue"
    optional: true

# 앱 UI 안정화 대기
- waitForAnimationToEnd

- assertVisible:
    id: "destination-button"

# 목적지: 잠실 설정
- tapOn:
    id: "destination-button"
- waitForAnimationToEnd
- tapOn:
    id: "search-input"
- evalScript: maestro.wait(1000)
- tapOn:
    id: "search-input"
- evalScript: maestro.wait(500)
- setClipboard: "잠실"
- evalScript: maestro.wait(500)
- pasteText
- evalScript: maestro.wait(2000)
- assertVisible:
    id: "suggestions-list"
- tapOn:
    id: "suggestion-item-2-016"
- waitForAnimationToEnd

# 취침 모드 ON
- scrollUntilVisible:
    element:
      id: "home-sleep-mode-switch"
    direction: DOWN
- evalScript: maestro.wait(500)
- tapOn:
    id: "home-sleep-mode-switch"
- evalScript: maestro.wait(1000)

# 위치를 잠실새내(잠실 1정거장 전)로 변경
- setLocation:
    latitude: 37.511687
    longitude: 127.086162

# 위치 변경 감지 + 알람 발생 대기 (폴링 30초 x 최대 4사이클)
- repeat:
    times: 120
    commands:
      - evalScript: maestro.wait(1000)

# 포그라운드 AlarmOverlay 확인
- assertVisible:
    text: "하차 알림"

- assertVisible:
    text: "알람 끄기"
