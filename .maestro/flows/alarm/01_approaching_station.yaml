appId: com.subwaynow.app
name: "알림 - 역 접근 시 알림 표시"
---
# 강남역에서 시작, 잠실 목적지 설정 후 역삼역으로 이동하여 접근 알림 확인
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: allow
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

# 강남역 감지 확인
- assertVisible:
    text: "강남"
    timeout: 15000

# 목적지 설정 (잠실)
- tapOn:
    id: "destination-button"
- assertVisible:
    id: "search-input"
    timeout: 5000
- tapOn:
    id: "search-input"
- inputText: "잠실"
- assertVisible:
    id: "suggestions-list"
    timeout: 5000
- tapOn:
    id: "suggestion-item-2-016"

# 목적지 설정됨 확인
- assertVisible:
    text: "잠실"
    timeout: 5000

# 취침 모드 활성화 (AlarmOverlay 확인용)
- tapOn:
    id: "home-sleep-mode-switch"

# 역삼역으로 이동 (강남 → 역삼 방향)
- setLocation:
    latitude: 37.500622
    longitude: 127.036456

# 역삼역 감지 및 경로 정보 표시 대기
- assertVisible:
    text: "역삼"
    timeout: 70000

# 정거장 남음 표시 확인 (경로 진행 중)
- assertVisible:
    text: ".*정거장 남음.*"
    timeout: 5000

# 선릉역으로 이동 → 도착 알림 오버레이 확인
- setLocation:
    latitude: 37.504286
    longitude: 127.048203

# 알림 오버레이 표시 확인
- assertVisible:
    id: "alarm-overlay"
    timeout: 70000

# 알람 끄기
- tapOn:
    id: "alarm-dismiss-button"
