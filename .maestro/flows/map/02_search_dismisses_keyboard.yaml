appId: com.subwaynow.app
name: "지도 탭 - 역 검색 후 키보드 자동 해제"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

# Expo dev-client URL 선택 화면 (개발 빌드에서만 등장)
- tapOn:
    text: ".*localhost.*"
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: ".*허용.*"
    optional: true

- swipe:
    start: 50%, 50%
    end: 50%, 95%

# 홈 로드 (testID는 즉시 노출)
- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000

# 역 감지 확인
- extendedWaitUntil:
    visible:
      text: "강남"
    timeout: 60000

# 지도 탭으로 이동 (좌표 기반 — iOS 탭 라벨 접근성 트리 불안정)
- tapOn:
    point: "37%,95%"

- extendedWaitUntil:
    visible:
      id: "recenter-button"
    timeout: 10000

# 검색창 탭 → 키보드 표시
- tapOn:
    id: "map-search-input"

# 역명 입력
- inputText: "강남"

# 추천 목록 등장 대기
- extendedWaitUntil:
    visible:
      id: "map-search-suggestions"
    timeout: 5000

# 추천 항목 첫 번째 탭 → 키보드가 닫히고 선택 카드가 나타나야 함
- tapOn:
    id: "map-search-suggestion-2-022"

# 선택 카드의 도착역 버튼은 화면 하단에 위치 → 키보드가 닫혀야만 탭 가능
- extendedWaitUntil:
    visible:
      id: "set-destination-button"
    timeout: 5000

- tapOn:
    id: "set-destination-button"

# 도착역 설정이 정상 동작 → 홈 탭으로 자동 전환됨을 확인
- extendedWaitUntil:
    visible:
      id: "destination-clear-button"
    timeout: 10000
