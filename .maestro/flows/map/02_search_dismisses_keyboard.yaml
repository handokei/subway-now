appId: com.subwaynow.app
name: "지도 탭 - 역 검색 후 키보드 자동 해제"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

- extendedWaitUntil:
    visible:
      text: "LIVE"
    timeout: 15000

# 지도 탭으로 이동
- tapOn:
    text: "지도"

- extendedWaitUntil:
    visible:
      id: "recenter-button"
    timeout: 10000

# 검색창 탭 → 키보드 표시
- tapOn:
    id: "map-search-input"

# 역명 입력
- inputText: "강남"

# 추천 목록 등장 대기
- extendedWaitUntil:
    visible:
      id: "map-search-suggestions"
    timeout: 5000

# 추천 항목 첫 번째 탭 → 키보드가 닫히고 선택 카드가 나타나야 함
- tapOn:
    id: "map-search-suggestion-2-022"

# 선택 카드의 도착역 버튼은 화면 하단에 위치 → 키보드가 닫혀야만 탭 가능
- extendedWaitUntil:
    visible:
      id: "set-destination-button"
    timeout: 5000

- tapOn:
    id: "set-destination-button"

# 도착역 설정이 정상 동작 → 홈 탭으로 자동 전환됨을 확인
- extendedWaitUntil:
    visible:
      text: "LIVE"
    timeout: 10000

- assertVisible:
    id: "destination-clear-button"
