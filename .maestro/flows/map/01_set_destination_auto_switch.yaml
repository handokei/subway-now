appId: com.subwaynow.app
name: "지도 탭 - 도착역 설정 후 홈 탭 자동 전환"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

- extendedWaitUntil:
    visible:
      text: "LIVE"
    timeout: 15000

# 지도 탭으로 이동
- tapOn:
    text: "지도"

- extendedWaitUntil:
    visible:
      id: "recenter-button"
    timeout: 10000

# 사용자 위치 근처 역(강남) 마커 탭 → 선택 카드 등장
- tapOn:
    text: "강남"

- extendedWaitUntil:
    visible:
      id: "set-destination-button"
    timeout: 5000

# 도착역으로 설정 → 홈 탭으로 자동 전환되어야 함
- tapOn:
    id: "set-destination-button"

# 홈 탭(현재 역) UI가 보이는지 확인
- extendedWaitUntil:
    visible:
      text: "LIVE"
    timeout: 10000

- assertVisible:
    id: "destination-clear-button"
