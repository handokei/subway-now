appId: com.subwaynow.app
name: "지도 탭 - 도착역 설정 후 홈 탭 자동 전환"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

# Expo dev-client URL 선택 화면 (개발 빌드에서만 등장)
- tapOn:
    text: ".*localhost.*"
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: ".*허용.*"
    optional: true

- swipe:
    start: 50%, 50%
    end: 50%, 95%

# 홈 로드 (testID는 즉시 노출)
- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000

# 역 감지 확인
- extendedWaitUntil:
    visible:
      text: "강남"
    timeout: 60000

# 지도 탭으로 이동
- tapOn:
    text: "지도"

- extendedWaitUntil:
    visible:
      id: "recenter-button"
    timeout: 10000

# 사용자 위치 근처 역(강남) 마커 탭 → 선택 카드 등장
- tapOn:
    text: "강남"

- extendedWaitUntil:
    visible:
      id: "set-destination-button"
    timeout: 5000

# 도착역으로 설정 → 홈 탭으로 자동 전환되어야 함
- tapOn:
    id: "set-destination-button"

# 홈 탭(현재 역) 으로 자동 전환되었고 도착역 설정이 반영되었는지 확인
- extendedWaitUntil:
    visible:
      id: "destination-clear-button"
    timeout: 10000
