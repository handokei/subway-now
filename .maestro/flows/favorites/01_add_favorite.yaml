appId: com.subwaynow.app
name: "즐겨찾기 - 추가"
---
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: allow
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

# 즐겨찾기 탭으로 이동
- tapOn:
    text: "즐겨찾기"
    timeout: 10000

# 빈 상태 확인
- assertVisible:
    id: "favorites-empty"
    timeout: 5000

# 역 검색
- tapOn:
    id: "favorites-search-input"
- inputText: "강남"

# 검색 결과에서 추가
- assertVisible:
    text: "강남"
    timeout: 5000
- tapOn:
    id: "favorite-add-2-022"

# 검색어 지우기
- tapOn:
    id: "favorites-search-input"
- clearText
- hideKeyboard

# 즐겨찾기 목록에 표시 확인
- assertVisible:
    text: "강남"
    timeout: 5000
