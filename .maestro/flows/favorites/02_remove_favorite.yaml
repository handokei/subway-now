appId: com.subwaynow.app
name: "즐겨찾기 - 삭제"
---
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: allow
      notifications: allow

- tapOn:
    text: ".*허용.*"
    optional: true

# 즐겨찾기 탭으로 이동
- tapOn:
    text: "즐겨찾기"
    timeout: 10000

# 먼저 즐겨찾기 추가
- tapOn:
    id: "favorites-search-input"
- inputText: "서울역"
- assertVisible:
    text: "서울역"
    timeout: 5000
- tapOn:
    id: "favorite-add-1-034"

# 검색어 지우기
- tapOn:
    id: "favorites-search-input"
- clearText
- hideKeyboard

# 즐겨찾기에 있는지 확인
- assertVisible:
    text: "서울역"
    timeout: 5000

# 삭제
- tapOn:
    id: "favorite-remove-1-034"

# 빈 상태 복원 확인
- assertVisible:
    id: "favorites-empty"
    timeout: 5000
