appId: com.subwaynow.app
name: "smoke - 즐겨찾기 추가 & 삭제"
---
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      notifications: allow
      location: always

- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 10000

# 즐겨찾기 탭 (62.5%)
- tapOn:
    point: "62%,95%"
- assertVisible:
    id: "favorites-empty"

# 추가
- tapOn:
    id: "favorites-search-input"
- inputText: "강남"
- tapOn:
    id: "favorite-add-2-022"
- tapOn:
    id: "favorites-search-input"
- eraseText
- hideKeyboard

- assertVisible:
    text: "강남|Gangnam"

# 삭제
- tapOn:
    id: "favorite-remove-2-022"
- assertVisible:
    id: "favorites-empty"
