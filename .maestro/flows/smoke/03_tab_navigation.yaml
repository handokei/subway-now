appId: com.subwaynow.app
name: "smoke - 탭 내비게이션 순회"
# iOS 탭 라벨이 accessibility 트리에 안정적이지 않아 좌표 기반 탭.
---
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      notifications: allow

- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 10000

# 지도 탭 (37.5%)
- tapOn:
    point: "37%,95%"
- extendedWaitUntil:
    visible:
      id: "recenter-button"
    timeout: 10000

# 즐겨찾기 탭 (62.5%)
- tapOn:
    point: "62%,95%"
- assertVisible:
    id: "favorites-search-input"

# 설정 탭 (87.5%)
- tapOn:
    point: "87%,95%"
- assertVisible:
    id: "sleep-mode-switch"

# 홈 탭 복귀 (12.5%)
- tapOn:
    point: "12%,95%"
- assertVisible:
    id: "destination-button"
