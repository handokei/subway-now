appId: com.subwaynow.app
name: "smoke - 취침 모드 토글 (홈 ↔ 설정 동기화)"
---
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      notifications: allow
      location: always

- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 10000

# 취침 모드는 목적지 설정 시에만 노출되므로 잠실 지정
- tapOn:
    id: "destination-button"
- assertVisible:
    id: "search-input"
- tapOn:
    id: "search-input"
- inputText: "잠실"
- assertVisible:
    id: "suggestions-list"
- tapOn:
    id: "suggestion-item-2-016"

# 잠실 설정 직후 destination 박스 높이가 커져 home-sleep-mode-switch가 viewport 밖.
# scrollUntilVisible은 nested ScrollView에서 element 인식 실패 가능 → 명시적 swipe로 강제 스크롤.
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
- extendedWaitUntil:
    visible:
      id: "home-sleep-mode-switch"
    timeout: 5000
- tapOn:
    id: "home-sleep-mode-switch"

# clearState로 useSleepModeGuide의 노출 플래그가 매번 리셋되어 첫 토글 시 Alert가 뜸.
# OK 버튼으로 닫아야 다음 탭 이동이 가능. optional로 두 번째 실행 안전.
- tapOn:
    text: "OK|확인"
    optional: true

# 설정 탭 동기화 확인
- tapOn:
    point: "87%,95%"
- assertVisible:
    id: "sleep-mode-switch"
- tapOn:
    id: "sleep-mode-switch"

# 홈 탭 복귀
- tapOn:
    point: "12%,95%"
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
- extendedWaitUntil:
    visible:
      id: "home-sleep-mode-switch"
    timeout: 5000
