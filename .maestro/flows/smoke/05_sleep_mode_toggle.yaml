appId: com.subwaynow.app
name: "smoke - 취침 모드 토글 (홈 ↔ 설정 동기화)"
---
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      notifications: allow

- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 10000

# 취침 모드는 목적지 설정 시에만 노출되므로 잠실 지정
- tapOn:
    id: "destination-button"
- assertVisible:
    id: "search-input"
- tapOn:
    id: "search-input"
- inputText: "잠실"
- assertVisible:
    id: "suggestions-list"
- tapOn:
    id: "suggestion-item-2-016"

- assertVisible:
    id: "home-sleep-mode-switch"
- tapOn:
    id: "home-sleep-mode-switch"

# 설정 탭 동기화 확인
- tapOn:
    point: "87%,95%"
- assertVisible:
    id: "sleep-mode-switch"
- tapOn:
    id: "sleep-mode-switch"

# 홈 탭 복귀
- tapOn:
    point: "12%,95%"
- assertVisible:
    id: "home-sleep-mode-switch"
