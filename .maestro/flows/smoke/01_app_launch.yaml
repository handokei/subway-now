appId: com.subwaynow.app
name: "smoke - 앱 실행 및 홈 화면 노출"
# 전제: EXPO_PUBLIC_E2E_MOCK=1 빌드. useNearestStation이 강남역 고정 fixture를 반환.
# GPS/권한 게이트는 mock으로 단락 → loading/permissionDenied false → 홈 즉시 렌더.
---
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      notifications: allow
      location: always

# Expo dev-client(개발 빌드 한정) 화면 — release 빌드에서는 없음
- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true

# Dev menu swipe-down
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 10000

# i18n 회귀 차단을 위해 testID로 검증 (#1230). HomeScreen의 origin station hero Text와
# destination button은 안정 testID를 노출하므로 locale/번역 변경 무관하게 결정적.
- assertVisible:
    id: "home-origin-station-name"
- assertVisible:
    id: "destination-button"
