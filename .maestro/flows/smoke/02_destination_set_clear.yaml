appId: com.subwaynow.app
name: "smoke - 목적지 설정 & 초기화"
---
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      notifications: allow
      location: always

- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 10000

# 목적지 설정 (잠실)
- tapOn:
    id: "destination-button"
- assertVisible:
    id: "search-input"
- tapOn:
    id: "search-input"
- inputText: "잠실"
- assertVisible:
    id: "suggestions-list"
- tapOn:
    id: "suggestion-item-2-016"

- assertVisible:
    text: "잠실|Jamsil"
- assertVisible:
    id: "destination-clear-button"

# 초기화
- tapOn:
    id: "destination-clear-button"
# destination 박스 축소 직후 ScrollView contentOffset이 즉시 클램프되지 않아 viewport 밖 가능 — scroll로 보정.
- scrollUntilVisible:
    element:
      text: "목적지 설정|Set destination"
    timeout: 5000
- assertVisible:
    text: "목적지 설정|Set destination"
