appId: com.subwaynow.app
name: "smoke - 목적지 설정 & 초기화"
---
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      notifications: allow
      location: always

- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 10000

# 목적지 설정 (잠실)
- tapOn:
    id: "destination-button"
- assertVisible:
    id: "search-input"
- tapOn:
    id: "search-input"
- inputText: "잠실"
- assertVisible:
    id: "suggestions-list"
- tapOn:
    id: "suggestion-item-2-016"

- extendedWaitUntil:
    visible:
      text: "잠실|Jamsil"
    timeout: 10000

# #634/#625 머지 후 route 박스 안에 BoardingTrainList/BoardingLockBanner가 들어와
# 박스 높이가 크게 증가 → actionsRow(destination-clear-button)가 viewport 밖.
# scrollUntilVisible로 실제 화면에 끌어올린 뒤 탭.
- scrollUntilVisible:
    element:
      id: "destination-clear-button"
    direction: DOWN
    timeout: 15000

# 초기화 — clear 후 ScrollView contentOffset이 남아 "목적지 설정"이 위쪽에 숨을 수 있음.
- tapOn:
    id: "destination-clear-button"
- scrollUntilVisible:
    element:
      text: "목적지 설정|Set destination"
    direction: UP
    timeout: 10000
