appId: com.subwaynow.app
name: "설정 - 다크모드 재시작 후 즉시 적용"
---
# 홈 로드 신호로 강남역 감지를 사용하기 위해 좌표 고정 (테스트 결정성 확보)
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

# Step 1: 초기 실행 (clearState로 AsyncStorage 초기화)
- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

# dev-client URL 선택 화면 (개발 빌드에서만)
- tapOn:
    text: ".*localhost.*"
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: ".*허용.*"
    optional: true

# Dev Menu가 있으면 swipe down으로 dismiss
- swipe:
    start: 50%, 50%
    end: 50%, 95%

# 홈 로드 (testID는 즉시 노출)
- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000

# 역 감지 확인
- extendedWaitUntil:
    visible:
      text: "강남"
    timeout: 60000

- takeScreenshot: .maestro/screenshots/01_initial_home_light

# 설정 탭 이동
- tapOn:
    point: "87%,95%"

# 다크 선택
- tapOn:
    id: "theme-dark"

- takeScreenshot: .maestro/screenshots/02_settings_dark_selected

# Step 2: 앱 종료 후 cold restart (AsyncStorage 유지)
- stopApp:
    appId: com.subwaynow.app

- launchApp:
    appId: com.subwaynow.app
    clearState: false
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*localhost.*"
    optional: true

- tapOn:
    text: ".*허용.*"
    optional: true

- swipe:
    start: 50%, 50%
    end: 50%, 95%

# 핵심 검증: 재시작 직후 홈 탭이 즉시 다크 테마로 보여야 함
- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: "강남"
    timeout: 60000

- takeScreenshot: .maestro/screenshots/03_home_after_restart_should_be_dark

# 설정 탭 진입 — 다크 segment가 active 상태로 유지되었는지
- tapOn:
    point: "87%,95%"

- extendedWaitUntil:
    visible:
      id: "theme-dark"
    timeout: 10000

- takeScreenshot: .maestro/screenshots/04_settings_dark_still_active
