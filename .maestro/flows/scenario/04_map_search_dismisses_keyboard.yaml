appId: com.subwaynow.app
name: "scenario - 지도 검색 후 키보드 자동 해제"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: ".*허용.*"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "강남"
    timeout: 60000

- tapOn:
    point: "37%,95%"
- extendedWaitUntil:
    visible:
      id: "recenter-button"
    timeout: 10000

- tapOn:
    id: "map-search-input"
- inputText: "강남"
- extendedWaitUntil:
    visible:
      id: "map-search-suggestions"
    timeout: 5000

- tapOn:
    id: "map-search-suggestion-2-022"
- extendedWaitUntil:
    visible:
      id: "set-destination-button"
    timeout: 5000

- tapOn:
    id: "set-destination-button"
- extendedWaitUntil:
    visible:
      id: "destination-clear-button"
    timeout: 10000
