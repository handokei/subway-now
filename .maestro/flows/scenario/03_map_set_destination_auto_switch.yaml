appId: com.subwaynow.app
name: "scenario - 지도 도착역 설정 → 홈 자동 전환"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

# 외부 시스템 UI(dev menu / permission alert) — text 매칭 유지
- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: ".*허용.*"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "home-origin-station-name"
      text: "강남"
    timeout: 60000

# Map 탭으로 이동 — 탭바는 좌표 탭 (네이티브 tab UI라 testID 부착 불가)
- tapOn:
    point: "37%,95%"
- extendedWaitUntil:
    visible:
      id: "recenter-button"
    timeout: 10000

# 지도 마커: 그룹 키는 normalize(station name) — 강남 마커
- tapOn:
    id: "marker-강남"
- extendedWaitUntil:
    visible:
      id: "set-destination-button"
    timeout: 5000

- tapOn:
    id: "set-destination-button"

- extendedWaitUntil:
    visible:
      id: "destination-clear-button"
    timeout: 10000
