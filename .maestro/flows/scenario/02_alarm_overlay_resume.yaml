appId: com.subwaynow.app
name: "scenario - AlarmOverlay 해제"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*localhost.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "허용"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

- assertVisible:
    id: "destination-button"

- tapOn:
    id: "destination-button"
- waitForAnimationToEnd
- tapOn:
    id: "search-input"
- evalScript: maestro.wait(1000)
- setClipboard: "잠실"
- evalScript: maestro.wait(500)
- pasteText
- evalScript: maestro.wait(2000)
- assertVisible:
    id: "suggestions-list"
- tapOn:
    id: "suggestion-item-2-016"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "home-sleep-mode-switch"
    direction: DOWN
- tapOn:
    id: "home-sleep-mode-switch"
- evalScript: maestro.wait(1000)

- setLocation:
    latitude: 37.511687
    longitude: 127.086162

- repeat:
    times: 120
    commands:
      - evalScript: maestro.wait(1000)

- assertVisible:
    text: "하차 알림"
- assertVisible:
    text: ".*내리세요"

- tapOn:
    text: "알람 끄기"
- evalScript: maestro.wait(1000)
- assertVisible:
    id: "destination-button"
