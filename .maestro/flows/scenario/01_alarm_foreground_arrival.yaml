appId: com.subwaynow.app
name: "scenario - 포그라운드 도착 알람"
# nightly. 강남 → 잠실새내(잠실 1정거장 전)로 이동 시 잠실 도착 알람 발화.
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

# 외부 시스템 UI(dev menu / permission alert) — text 매칭 유지
- tapOn:
    text: ".*localhost.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "허용"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

- assertVisible:
    id: "destination-button"

# 목적지: 잠실
- tapOn:
    id: "destination-button"
- waitForAnimationToEnd
- tapOn:
    id: "search-input"
- evalScript: maestro.wait(1000)
- setClipboard: "잠실"
- evalScript: maestro.wait(500)
- pasteText
- evalScript: maestro.wait(2000)
- extendedWaitUntil:
    visible:
      id: "suggestions-list"
    timeout: 5000
- tapOn:
    id: "suggestion-item-2-016"
- waitForAnimationToEnd

# 취침 모드 ON
- scrollUntilVisible:
    element:
      id: "home-sleep-mode-switch"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "home-sleep-mode-switch"
- evalScript: maestro.wait(1000)

# 잠실새내 좌표로 변경
- setLocation:
    latitude: 37.511687
    longitude: 127.086162

- repeat:
    times: 120
    commands:
      - evalScript: maestro.wait(1000)

- extendedWaitUntil:
    visible:
      id: "alarm-overlay-title"
    timeout: 5000
- assertVisible:
    id: "alarm-dismiss-button"
