appId: com.subwaynow.app
name: "scenario - 다크모드 재시작 후 즉시 적용"
---
- setLocation:
    latitude: 37.49799
    longitude: 127.027912

- launchApp:
    appId: com.subwaynow.app
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: ".*허용.*"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "강남"
    timeout: 60000

- takeScreenshot: .maestro/screenshots/01_initial_home_light

- tapOn:
    point: "87%,95%"
- tapOn:
    id: "theme-dark"

- takeScreenshot: .maestro/screenshots/02_settings_dark_selected

- stopApp:
    appId: com.subwaynow.app
- launchApp:
    appId: com.subwaynow.app
    clearState: false
    permissions:
      location: always
      notifications: allow

- tapOn:
    text: ".*localhost.*"
    optional: true
- tapOn:
    text: ".*허용.*"
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 95%

- extendedWaitUntil:
    visible:
      id: "destination-button"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "강남"
    timeout: 60000

- takeScreenshot: .maestro/screenshots/03_home_after_restart_should_be_dark

- tapOn:
    point: "87%,95%"
- extendedWaitUntil:
    visible:
      id: "theme-dark"
    timeout: 10000

- takeScreenshot: .maestro/screenshots/04_settings_dark_still_active
