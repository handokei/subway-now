name: Wire-completion CI

# #1582 — Wire-completion 5단 룰 lite 게이트.
# ts-prune로 orphan export(미연결 신호/모듈)를 탐지해 "코드만 머지되고 호출자 없음" 회귀를 차단한다.
# 5단 룰 중 1단(orphan 탐지)에 해당. 나머지 4단(V/X dashboard, 의존 PR, 측정 PR template,
# device verify)은 PR template으로 강제한다.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  orphan-detection:
    name: Orphan Export Detection
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: Orphan export 검사 (ts-prune)
        run: npm run lint:orphan

  adr-conflict-section:
    name: ADR Conflict Declaration Check
    runs-on: ubuntu-latest
    # base가 dev인 PR(ADR을 새로 작성하는 PR)에만 실행한다. base가 main인 릴리스 PR(dev→main)은
    # main 이후 작성된 모든 ADR이 diff-filter=A(added)로 집계돼 소급 강제가 되므로 skip한다(#2935, #2932 회귀).
    # push 이벤트(github.base_ref 없음)는 dev와 동일하게 취급해 계속 검사한다.
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'

    steps:
      - name: 코드 체크아웃 (base ref 비교 위해 전체 history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ADR "수정·대체·모순하는 결정" 섹션 검사 (#2931)
        run: bash scripts/check-adr-conflict-section.sh "origin/${{ github.base_ref || 'dev' }}"

  swift-mirror-check:
    name: Swift MIRROR Sync Check
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: MIRROR 사본 diff 검사 (#2839)
        run: bash scripts/check-swift-mirror.sh
