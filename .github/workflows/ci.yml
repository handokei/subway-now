name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: TypeScript 타입 체크
        run: npm run type-check

      - name: 단위 테스트 실행 (커버리지 100% 검증)
        run: npm test -- --ci --forceExit

  e2e-smoke:
    name: E2E Smoke (mock mode)
    # PR 머지 게이트. EXPO_PUBLIC_E2E_MOCK=1로 useNearestStation을 강남 고정 fixture로 단락 → 5분 내 결정성.
    needs: test
    runs-on: macos-14
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_E2E_MOCK: 'true'
      SIM_NAME: 'iPhone 16'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Xcode 버전 고정
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: latest-stable

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: Maestro CLI 설치
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: iOS Prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods 캐시
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: CocoaPods 설치
        run: cd ios && pod install

      - name: DerivedData 캐시
        uses: actions/cache@v4
        with:
          path: ios/build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json', 'modules/**', 'targets/**', 'app.config.js', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: deriveddata-${{ runner.os }}-

      - name: Mock env를 Xcode build phase로 주입
        # xcodebuild → build phase → Metro 체인의 env 전파 누락에 대비.
        # Expo의 with-environment.sh가 .xcode.env.local을 소싱하므로 여기 export 추가.
        run: |
          echo 'export EXPO_PUBLIC_E2E_MOCK=true' >> ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: iOS 빌드 (Release, mock mode)
        # CI에는 Metro dev server가 없으므로 JS 번들이 임베드된 Release 빌드를 사용.
        # Expo SDK 54의 Debug+simulator build phase는 FORCE_BUNDLING을 무시해 번들이 .app에 안 들어감.
        # Release는 항상 번들을 임베드하고 prod 동작과도 일치.
        env:
          EXPO_PUBLIC_E2E_MOCK: 'true'
        run: |
          cd ios
          xcodebuild -workspace subwaynow.xcworkspace \
            -scheme subwaynow \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: JS 번들에 mock sentinel이 inline되었는지 검증
        # Hermes bytecode는 숫자 리터럴을 보존하지 않으므로 좌표 grep 불가.
        # 대신 src/constants/e2e.ts의 문자열 sentinel을 사용. Hermes는 UTF-8 문자열 테이블을 유지함.
        # IS_E2E_MOCK이 babel-time에 true 상수로 inline되면 활성 sentinel만 번들에 남는다.
        run: |
          BUNDLE=$(find ios/build -path '*/Build/Products/Release-iphonesimulator/*.app/main.jsbundle' -type f | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::error::main.jsbundle을 .app에서 찾지 못함."
            find ios/build -name "*.app" -type d
            exit 1
          fi
          # sentinel 문자열을 src/constants/e2e.ts에서 동적 추출 (SSOT)
          ACTIVE=$(node -e "const m=require('fs').readFileSync('src/constants/e2e.ts','utf8'); const r=m.match(/'(__E2E_MOCK_ACTIVE_[^']+)'/); if(!r){process.exit(1)} console.log(r[1])")
          INACTIVE=$(node -e "const m=require('fs').readFileSync('src/constants/e2e.ts','utf8'); const r=m.match(/'(__E2E_MOCK_INACTIVE[^']*)'/); if(!r){process.exit(1)} console.log(r[1])")
          if [ -z "$ACTIVE" ] || [ -z "$INACTIVE" ]; then
            echo "::error::src/constants/e2e.ts에서 sentinel 문자열 추출 실패"
            exit 1
          fi
          if grep -q "$ACTIVE" "$BUNDLE"; then
            echo "Mock fixture inline 확인됨 (sentinel=$ACTIVE, $BUNDLE)"
          elif grep -q "$INACTIVE" "$BUNDLE"; then
            echo "::error::mock 비활성 sentinel($INACTIVE)이 들어감. EXPO_PUBLIC_E2E_MOCK이 Metro 번들링에 전파되지 않음."
            exit 1
          else
            echo "::error::어떤 sentinel도 번들에 없음. babel-preset-expo의 EXPO_PUBLIC_* inlining이 작동 안 한 것으로 보임."
            exit 1
          fi

      - name: 시뮬레이터 부팅
        run: |
          xcrun simctl boot "${SIM_NAME}" || true
          xcrun simctl bootstatus "${SIM_NAME}" -b

      - name: 앱 설치
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "ERROR: .app not found"; exit 1; fi
          xcrun simctl install booted "$APP_PATH"

      - name: Maestro Smoke 실행
        run: maestro test .maestro/flows/smoke/ --retry 1 --format junit --output maestro-smoke.xml

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-results
          path: maestro-smoke.xml
