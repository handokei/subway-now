name: CI

on:
  push:
    branches: [main, dev]
  # #1389 — stacked PR(base가 dev/main 아닌 경우)에도 CI 게이트가 동작하도록 branches 필터 미적용.
  # required CI(Data Validation + Type Check & Test)는 모든 PR에 동등 적용해야 머지 전 검증이 깨지지 않는다.
  pull_request:

jobs:
  data-validation:
    name: Data Validation
    # stations.json + lineTopology.json 정합성을 5초 안에 검증 (#1039).
    # 데이터 손상이 type check / test보다 먼저 fail-fast 되도록 분리한다.
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: stations.json + lineTopology 검증
        run: node scripts/validate-stations.js

  test:
    name: Type Check & Test
    needs: [data-validation]
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: TypeScript 타입 체크
        run: npm run type-check

      - name: 단위 테스트 실행 (커버리지 100% 검증)
        run: npm test -- --ci --forceExit

  backend-validation:
    # #1624 — backend/alarm-worker type-check + vitest CI gate.
    # frontend `test` job은 backend를 검증하지 않으므로 별도 job으로 회귀 차단.
    #
    # **frontend deps 선행 설치 필수**: backend/alarm-worker/src/sentry.ts가
    # `../../../src/shared/infra/monitoring/tripTokenHash`를 import한다. root tsconfig.json이
    # `expo/tsconfig.base`를 extends하므로, expo 패키지(=frontend node_modules) 부재 시
    # vite transform이 'Cannot find module expo/tsconfig.base/tsconfig.json' 으로 fail.
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: frontend 의존성 설치 (expo tsconfig.base resolver)
        run: npm ci --legacy-peer-deps

      - name: backend 의존성 설치
        working-directory: backend/alarm-worker
        run: npm ci

      - name: TypeScript 타입 체크
        working-directory: backend/alarm-worker
        run: npm run type-check

      - name: vitest 실행 (coverage 게이트 포함, #2081)
        working-directory: backend/alarm-worker
        run: npm test
