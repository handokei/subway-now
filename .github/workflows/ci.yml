name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: TypeScript 타입 체크
        run: npm run type-check

      - name: 단위 테스트 실행 (커버리지 100% 검증)
        run: npm test -- --ci --forceExit

  e2e:
    name: E2E Tests (Maestro)
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Xcode 버전 고정
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: Maestro CLI 설치
        run: |
          export MAESTRO_VERSION=2.4.0
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: 사용 가능한 시뮬레이터 확인
        id: sim
        run: |
          # 사용 가능한 iPhone 시뮬레이터 중 첫 번째 선택
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            if 'iOS' in runtime:
              for d in devices:
                if 'iPhone' in d['name'] and d['isAvailable']:
                  print(d['name']); sys.exit(0)
          " 2>/dev/null || echo "")
          if [ -z "$SIM_NAME" ]; then
            echo "No available iPhone simulator found. Creating one..."
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
            import json, sys
            for r in json.load(sys.stdin)['runtimes']:
              if 'iOS' in r['name'] and r['isAvailable']:
                print(r['identifier']); sys.exit(0)
            ")
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
            import json, sys
            for d in json.load(sys.stdin)['devicetypes']:
              if 'iPhone' in d['name']:
                last = d
            print(last['identifier'])
            ")
            xcrun simctl create "CI-iPhone" "$DEVICE_TYPE" "$RUNTIME"
            SIM_NAME="CI-iPhone"
          fi
          echo "simulator=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_NAME"

      - name: iOS Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: CocoaPods 설치
        run: cd ios && pod install

      - name: iOS 빌드 (Debug)
        run: |
          cd ios
          xcodebuild -workspace subwaynow.xcworkspace \
            -scheme subwaynow \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.simulator }}' \
            -derivedDataPath build \
            build

      - name: 시뮬레이터 부팅 및 준비 대기
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.simulator }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.simulator }}" -b

      - name: 앱 설치
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "ERROR: .app not found"; exit 1; fi
          xcrun simctl install booted "$APP_PATH"

      - name: Maestro E2E 테스트 실행
        run: maestro test .maestro/flows/ --format junit --output maestro-report.xml

      - name: E2E 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: maestro-report.xml
