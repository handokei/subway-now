name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: TypeScript 타입 체크
        run: npm run type-check

      - name: 단위 테스트 실행 (커버리지 100% 검증)
        run: npm test -- --ci --forceExit

  e2e:
    name: E2E Tests (Maestro)
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Xcode 버전 고정
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: iOS 시뮬레이터 런타임 설치
        run: |
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep iPhone

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: Maestro CLI 설치
        run: |
          export MAESTRO_VERSION=2.4.0
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: iOS Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: CocoaPods 설치
        run: cd ios && pod install

      - name: iOS 빌드 (Debug)
        run: |
          cd ios
          xcodebuild -workspace subwaynow.xcworkspace \
            -scheme subwaynow \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build \
            build

      - name: 시뮬레이터 부팅 및 준비 대기
        run: |
          xcrun simctl boot "iPhone 17 Pro" || true
          xcrun simctl bootstatus "iPhone 17 Pro" -b

      - name: 앱 설치
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "ERROR: .app not found"; exit 1; fi
          xcrun simctl install booted "$APP_PATH"

      - name: Maestro E2E 테스트 실행
        run: |
          maestro test .maestro/flows/home/ --format junit --output maestro-home.xml
          maestro test .maestro/flows/favorites/ --format junit --output maestro-favorites.xml
          maestro test .maestro/flows/location/ --format junit --output maestro-location.xml
          maestro test .maestro/flows/navigation/ --format junit --output maestro-navigation.xml
          maestro test .maestro/flows/alarm/ --format junit --output maestro-alarm.xml

      - name: E2E 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: maestro-*.xml
