name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: TypeScript 타입 체크
        run: npm run type-check

      - name: 단위 테스트 실행 (커버리지 100% 검증)
        run: npm test -- --ci --forceExit

  e2e-smoke:
    name: E2E Smoke (mock mode)
    # PR 머지 게이트. EXPO_PUBLIC_E2E_MOCK=1로 useNearestStation을 강남 고정 fixture로 단락 → 5분 내 결정성.
    needs: test
    runs-on: macos-14
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_E2E_MOCK: 'true'
      SIM_NAME: 'iPhone 16'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Xcode 버전 고정
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: latest-stable

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: Maestro CLI 설치
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: iOS Prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods 캐시
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: CocoaPods 설치
        run: cd ios && pod install

      - name: DerivedData 캐시
        uses: actions/cache@v4
        with:
          path: ios/build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json', 'modules/**', 'targets/**', 'app.config.js', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: deriveddata-${{ runner.os }}-

      - name: iOS 빌드 (Debug, mock mode + forced bundle)
        # CI에는 Metro dev server가 없으므로 Debug에서도 JS 번들을 강제로 임베드(FORCE_BUNDLING=1).
        # 이 단계에서 react-native bundle이 EXPO_PUBLIC_E2E_MOCK을 inline한다.
        env:
          EXPO_PUBLIC_E2E_MOCK: 'true'
          FORCE_BUNDLING: '1'
        run: |
          cd ios
          xcodebuild -workspace subwaynow.xcworkspace \
            -scheme subwaynow \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -derivedDataPath build \
            build

      - name: JS 번들에 mock fixture가 inline되었는지 검증
        # IS_E2E_MOCK이 true 상수로 inline되면 E2E_MOCK_LOCATION 값도 번들에 포함됨.
        # 검증 좌표는 src/constants/e2e.ts에서 동적으로 읽어 SSOT 유지.
        run: |
          BUNDLE=$(find ios/build -path '*/Build/Products/Debug-iphonesimulator/*.app/main.jsbundle' -type f | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::error::main.jsbundle을 .app에서 찾지 못함. FORCE_BUNDLING이 적용되지 않음."
            find ios/build -name "*.app" -type d
            exit 1
          fi
          LAT=$(node -e "console.log(require('./src/constants/e2e').E2E_MOCK_LOCATION.latitude)" 2>/dev/null \
                || node -e "const m=require('fs').readFileSync('src/constants/e2e.ts','utf8'); const r=m.match(/latitude:\s*([0-9.]+)/); if(!r){process.exit(1)} console.log(r[1])")
          if [ -z "$LAT" ]; then
            echo "::error::src/constants/e2e.ts에서 latitude를 추출하지 못함"
            exit 1
          fi
          if ! grep -q "$LAT" "$BUNDLE"; then
            echo "::error::E2E mock fixture($LAT)가 번들에 inline되지 않음. EXPO_PUBLIC_E2E_MOCK 전파 실패."
            exit 1
          fi
          echo "Mock fixture inline 확인됨 (lat=$LAT, $BUNDLE)"

      - name: 시뮬레이터 부팅
        run: |
          xcrun simctl boot "${SIM_NAME}" || true
          xcrun simctl bootstatus "${SIM_NAME}" -b

      - name: 앱 설치
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "ERROR: .app not found"; exit 1; fi
          xcrun simctl install booted "$APP_PATH"

      - name: Maestro Smoke 실행
        run: maestro test .maestro/flows/smoke/ --retry 1 --format junit --output maestro-smoke.xml

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-results
          path: maestro-smoke.xml
