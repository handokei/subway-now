name = "subway-now-alarm-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# KV: active trips
# 생성: wrangler kv:namespace create TRIPS
[[kv_namespaces]]
binding = "TRIPS"
id = "8d10a57ffe4c46e28a6df33ef0c86b68"
preview_id = "7e67683c147349ed90c16a28ae232e34"

# KV: pending silent pushes (#566 P2a)
# 발사한 silent push 1건마다 pushId entry를 기록. P2c가 30s 미ACK push를 alert fallback으로 재발사.
# 코드는 `if (env.PENDING_PUSHES)` 분기로 graceful — binding 없으면 모든 pending 경로가 no-op.
[[kv_namespaces]]
binding = "PENDING_PUSHES"
id = "12e5eae8b5c94420b0efc1e89870c845"
preview_id = "53a86628f78c48fa91fa954f84514df3"

# KV: 사용자 버그 신고 (#1034, docs/requirements/12-cross-cutting.md)
# `POST /feedback`이 메시지 + 디바이스 컨텍스트를 30일 TTL로 적재.
# 운영자가 `wrangler kv key list --binding FEEDBACK`으로 수거 후 분기 트리아지.
# TODO: 운영자가 `wrangler kv namespace create FEEDBACK` (+ `--preview`)로 실제 ID 발급 후
#       아래 placeholder 두 줄을 교체. 코드는 `if (env.FEEDBACK)` 분기로 graceful —
#       binding 미설정 환경(현재 placeholder 상태)에서는 endpoint가 503 응답.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "REPLACE_WITH_FEEDBACK_KV_ID"
preview_id = "REPLACE_WITH_FEEDBACK_KV_PREVIEW_ID"

# #498 — silent push 게이트 outcome 텔레메트리. 클라가 누적한 카운터를 일별 query 가능하게 적재.
# Privacy: 카운트만, token은 8자 prefix만. 개별 push 내용/좌표 미저장.
#
# 임시 비활성화 (#506): Analytics Engine은 Workers Paid 전용. 현재 Free plan에서는
# binding 선언만으로도 deploy가 실패한다(Cloudflare API 10089). 코드는 `if (writer)` 분기로
# graceful — binding 없으면 런타임에 datapoint 적재만 skip하고 ok 응답한다.
# 운영 통계(stop-rate / push→ack 비율) 수집 보류. silent push 본 기능엔 영향 없음.
# 복원: Paid 전환 시 아래 3줄 주석 해제 후 `npx wrangler deploy`.
# [[analytics_engine_datasets]]
# binding = "TELEMETRY"
# dataset = "silent_push_telemetry"

# 1분마다 활성 트립 폴링
[triggers]
crons = ["*/1 * * * *"]

# Observability — Workers Logs persist (#863)
# `wrangler tail`은 실시간 1~2분 윈도우만 잡혀 retrospective 진단 불가.
# logs만 활성화해 invocation logs를 Workers Logs에 영구 저장, dashboard에서 조회 가능.
# traces는 비용/성능 영향 최소화 위해 일단 비활성. 필요 시 토글.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# 공개 환경변수 (시크릿은 `wrangler secret put` 사용)
# - SEOUL_API_KEY          : 서울 열린데이터 API 키
# - APNS_KEY_ID            : APNs 인증키 KeyID
# - APNS_TEAM_ID           : Apple Developer Team ID
# - APNS_PRIVATE_KEY       : .p8 PEM 본문 (BEGIN/END 라인 포함)
# - APNS_BUNDLE_ID         : 앱 번들 ID (예: com.handokei.subwaynow)
#
# #972 — recall alert webhook (PR #961 follow-up). 셋 다 설정되어야 cron이 평가/발사한다.
# 하나라도 비어 있으면 `evaluateAndMaybeAlert`가 graceful no-op (현재 Workers Paid 대기로 사실상 비활성).
# - RECALL_ALERT_WEBHOOK_URL  : Slack incoming webhook URL 또는 호환 receiver
# - CF_ACCOUNT_ID             : Cloudflare account ID (Analytics Engine SQL HTTP API endpoint 조립)
# - CF_API_TOKEN              : Cloudflare API token (Analytics Engine read 권한)
[vars]
APNS_HOST = "api.push.apple.com"
APNS_HOST_SANDBOX = "api.sandbox.push.apple.com"
SEOUL_API_HOST = "swopenapi.seoul.go.kr"
